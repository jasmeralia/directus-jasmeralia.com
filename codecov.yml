coverage:
  status:
    project:
      default:
        target: 80%
        informational: false
    patch:
      default:
        target: 80%
        informational: false

comment:
  layout: "reach, diff, flags, files"
  require_changes: true

ignore:
  - "site/src/**/*.test.ts"
  - "site/src/test/**"
