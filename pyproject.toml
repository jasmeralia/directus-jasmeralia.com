[tool.mypy]
check_untyped_defs = true
exclude = ["mcp/scripts/ignored/"]

[tool.pylint.main]
ignore-paths = ["^mcp/scripts/ignored/.*$"]

[tool.pylint."messages control"]
disable = ["broad-exception-caught"]

[tool.pylint.format]
max-line-length = 180
# Set to 2000 per Morgan's direct instruction (2026-09-07) after repeatedly
# bumping this in small increments as mcp/scripts/ahitr_quest_sync.py grew -
# stop revisiting this value for that reason alone.
max-module-lines = 2000

[tool.pylint.design]
max-args = 6
max-branches = 32
max-locals = 55
max-positional-arguments = 6
max-returns = 7
max-statements = 130

[tool.pylint.similarities]
min-similarity-lines = 15

[tool.ruff]
exclude = ["mcp/scripts/ignored"]
